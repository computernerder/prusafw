# Factory Prusa MINI ST7789V display and rotary encoder.
# Requires the Jeric ST7789V host-side Klipper driver.
[display]
lcd_type: st7789v
spi_bus: spi2a
rst_pin: PC8
cs_pin: PC9
rs_pin: PD11
encoder_pins: ^PE13, ^PE15
click_pin: ^!PE12
display_group: jeric_mini
menu_timeout: 30

[display_data jeric_mini nozzle]
position: 0, 0
text: { "NOZZLE %3.0f>%3.0fC" % (printer.extruder.temperature, printer.extruder.target) }

[display_data jeric_mini bed]
position: 1, 0
text: { "BED    %3.0f>%3.0fC" % (printer.heater_bed.temperature, printer.heater_bed.target) }

[display_data jeric_mini state]
position: 2, 0
text:
  {% set state = printer.print_stats.state|string|upper %}
  {% if state == "STANDBY" %}
    STATUS READY
  {% else %}
    STATUS { state }
  {% endif %}

[display_data jeric_mini progress]
position: 3, 0
text:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    PROGRESS { "%3.0f%%" % (printer.display_status.progress * 100,) }
  {% else %}
    READY FOR A JOB
  {% endif %}

[display_data jeric_mini job]
position: 4, 0
text:
  {% if printer.print_stats.filename %}
    { printer.print_stats.filename.split('/')[-1][:22] }
  {% else %}
    NO FILE SELECTED
  {% endif %}

[display_data jeric_mini time]
position: 5, 0
text:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    TIME { render("_printing_time").strip() }
  {% else %}
    FILAMENT { printer.save_variables.variables.filament_loaded|default("UNKNOWN")|string|upper }
  {% endif %}

[display_data jeric_mini filament]
position: 6, 0
text:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    FILAMENT { printer.save_variables.variables.filament_loaded|default("UNKNOWN")|string|upper }
  {% else %}
    REVO { printer.save_variables.variables.revo_filament_position|default("UNKNOWN")|string|upper }
  {% endif %}

[display_data jeric_mini controls]
position: 7, 0
text: PRESS KNOB: CONTROLS

# Put Jeric's most useful controls at the top of Klipper's standard menu.
[menu __main]
type: list
name: Jeric MINI

[menu __main __jeric_files]
type: vsdlist
index: 0
enable: {('virtual_sdcard' in printer)}
name: Files / Start

[menu __main __jeric_files __start]
type: command
index: 0
enable: {printer.virtual_sdcard.file_path and not printer.virtual_sdcard.is_active}
name: START SELECTED FILE
gcode: M24

[menu __main __jeric_pause]
type: command
index: 1
enable: {printer.print_stats.state == "printing"}
name: PAUSE PRINT
gcode: PAUSE

[menu __main __jeric_resume]
type: command
index: 2
enable: {printer.print_stats.state == "paused"}
name: RESUME PRINT
gcode: RESUME

[menu __main __jeric_stop]
type: list
index: 3
enable: {printer.print_stats.state in ["printing", "paused"]}
name: SAFE STOP PRINT...

[menu __main __jeric_stop __confirm]
type: command
name: CONFIRM SAFE STOP
gcode: CANCEL_PRINT

[menu __main __jeric_filament]
type: list
index: 4
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Filament: {printer.save_variables.variables.filament_loaded|default("UNKNOWN")|string|upper}

[menu __main __jeric_filament __unload]
type: command
index: 0
name: UNLOAD FILAMENT
gcode: UNLOAD_FILAMENT

[menu __main __jeric_filament __pla]
type: command
name: LOAD PLA
gcode: LOAD_FILAMENT TYPE=PLA TEMP=215

[menu __main __jeric_filament __plaplus]
type: command
name: LOAD PLA+
gcode: LOAD_FILAMENT TYPE=PLAPLUS TEMP=220

[menu __main __jeric_filament __petg]
type: command
name: LOAD PETG
gcode: LOAD_FILAMENT TYPE=PETG TEMP=240

[menu __main __jeric_filament __abs]
type: command
name: LOAD ABS
gcode: LOAD_FILAMENT TYPE=ABS TEMP=255

[menu __main __jeric_filament __absplus]
type: command
name: LOAD ABS+
gcode: LOAD_FILAMENT TYPE=ABSPLUS TEMP=255

[menu __main __jeric_filament __asa]
type: command
name: LOAD ASA
gcode: LOAD_FILAMENT TYPE=ASA TEMP=255

[menu __main __jeric_filament __tpu]
type: command
name: LOAD TPU
gcode: LOAD_FILAMENT TYPE=TPU TEMP=225
