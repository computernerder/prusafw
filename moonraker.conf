[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: ~/printer_data/comms/klippy.sock
data_path: ~/printer_data

[file_manager]
config_path: ~/printer_data/config
log_path: ~/printer_data/logs
enable_object_processing: True

[authorization]
trusted_clients:
  127.0.0.1
  192.168.1.0/24
cors_domains:
  *.local
  *.lan

[octoprint_compat]

[history]

[announcements]
subscriptions:
    mainsail

[update_manager]
channel: dev
refresh_interval: 168

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail
