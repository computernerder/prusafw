
[gcode_macro PRINT_START]

gcode:
       # Load variables
    {% set bed_temp = params.BED|default(60)|int %}
    {% set extruder_temp = params.EXTRUDER|default(200)|int %}
    {% set nozzle_size = params.NOZZLE|default(0.4)|float %}
    M83
    M104 S{extruder_temp}                   ; set extruder holding temp, dont wait
    M190 S{bed_temp}                        ; set bed temp and wait for it reach temp
    G28                                     ; home all axes
    G29                                     ; ABL
    M104 S{extruder_temp}                   ; Set extruder temp dont wait    
    G1 Y-2.0 X179 F2400                     ; Move to start position x, y
    G1 Z3 F720                              ; move to start postiion z
    M109 S{extruder_temp}                   ; Set extruder temp wait
    

    G92 E0.0                                ;Set extruded to 0
    G1 E50 F2100                            ;extrude
    PURGE EXTRUDER={extruder_temp}
    M221 S100 ; set flow
    # OrcaSlicer sometimes emits an M600 immediately after PRINT_START (before the actual print).
    # Arm a short-lived guard to ignore that one startup M600.
    SET_GCODE_VARIABLE MACRO=_M600_GUARD VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_CLEAR_M600_GUARD DURATION=5


[gcode_macro PURGE]

gcode:
    {% set extruder_temp = params.EXTRUDER|default(200)|int %}

    M109 S{extruder_temp}
    G90
    G1 X170 F1000
    G1 Z0.2 F720
    G1 X110.0 E8.0 F900
    G1 X40.0 E10.0 F700
    G92 E0.0
   
    G1 Z20


[gcode_macro _M600_GUARD]
variable_active: 0
gcode:
  ; internal


[delayed_gcode _CLEAR_M600_GUARD]
gcode:
  SET_GCODE_VARIABLE MACRO=_M600_GUARD VARIABLE=active VALUE=0


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    {% set th = printer.toolhead %}
  {% set loaded_filament = printer.save_variables.variables.filament_loaded|default("UNKNOWN")|string|upper %}
  {% if loaded_filament != "UNKNOWN" %}
  SAVE_VARIABLE VARIABLE=filament_last_print VALUE='"{loaded_filament}"'
  {% endif %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5 F2100 ; retract
    

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F50000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F50000  ; park nozzle at rear
    G1 E-45 F2100 ; retract
    M221 S100 ; reset flow
    TURN_OFF_HEATERS
    M107                                     ; turn off fan 
    M84 ; disable motors

    
    
    ;BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


[gcode_macro SET_FILAMENT]
description: Persistently set the currently loaded filament type (for PRINT_START checks)
gcode:
  {% set filament_raw = params.TYPE|default("")|string|upper %}
  {% set filament = filament_raw|replace(" ", "")|replace("_", "")|replace("+", "PLUS") %}
  {% if "PLAPLUS" in filament or "PLA+" in filament_raw|upper %}
    {% set filament = "PLAPLUS" %}
  {% elif "TPU" in filament %}
    {% set filament = "TPU" %}
  {% elif "ASA" in filament %}
    {% set filament = "ASA" %}
  {% elif "ABS" in filament %}
    {% set filament = "ABS" %}
  {% elif "PLA" in filament %}
    {% set filament = "PLA" %}
  {% endif %}
  {% if filament == "" %}
    {action_raise_error("SET_FILAMENT requires TYPE=<PLA|PLAPLUS|TPU|ABS|ASA>")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=filament_loaded VALUE='"{filament}"'
  {action_respond_info("Loaded filament set to: " ~ filament)}


[gcode_macro FILAMENT_STATUS]
description: Print current filament tracking state to the console
gcode:
  {% set loaded = printer.save_variables.variables.filament_loaded|default("UNKNOWN")|string|upper %}
  {% set requested = printer.save_variables.variables.filament_requested|default("UNKNOWN")|string|upper %}
  {% set last_print = printer.save_variables.variables.filament_last_print|default("UNKNOWN")|string|upper %}
  {action_respond_info("Filament status: loaded=" ~ loaded ~ " requested=" ~ requested ~ " last_print=" ~ last_print)}
    



[gcode_macro Load_Filament_1]
gcode:
  {% set Temp = params.Temp|default(255)|float %}
  M104 S{Temp}  ;Set temp 
  G91
  G1 E180 F2100;  Load
  G1 E50 F1000 ; prime

[gcode_macro TEMPERATURE_TOWER]
gcode:
  {% set START = params.START|default(220)|float %}
  {% set INC = params.INC|default(-5)|float %}
  {% set MM = params.MM|default(10)|float %}
  {% set SKIP = params.Skip|default(1.4)|float %}
  {% set START = START - INC / 2 %}
  {% set FACTOR = INC / MM %}
  TUNING_TOWER COMMAND='SET_HEATER_TEMPERATURE HEATER=extruder' PARAMETER=TARGET START={START} FACTOR={FACTOR} BAND={MM} SKIP={SKIP}



[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  {% set fc = printer['gcode_macro FILAMENT_CHANGE'] %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  # If a filament change is active, reheat to stored target before extruding/resuming.
  {% if fc.active|int == 1 and fc.restore_temp|int > 0 %}
    M109 S{fc.restore_temp|int}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if fc.active|int == 1 and fc.prime|float > 0 %}
      G1 E{fc.prime|float} F600
      SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=active VALUE=0
      SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=restore_temp VALUE=0
    {% endif %}
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}



# Filament change gcode, parameters are a default park position if no XYZ is specified  - Z is relative.
[gcode_macro M600_1]

gcode:
    {% set X = params.X|default(100)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    M117 Ready for unload

[gcode_macro LOAD_FILAMENT]
description: Load filament exactly 225mm (no prime)
gcode:
  {% set temp = params.TEMP|default(printer.extruder.target)|int %}
  {% if temp|int < 170 %}
    {% set temp = 220 %}
  {% endif %}

  M117 Loading Filament...
  SAVE_GCODE_STATE NAME=STATE_LOAD_FILAMENT

  M83
  M109 S{temp}             ; heat and wait (override with TEMP= if desired)
  G1 E225 F1200            ; exactly 225mm insert, no prime
  G92 E0.0
  M400

  RESTORE_GCODE_STATE NAME=STATE_LOAD_FILAMENT
  M117 Load Complete


[gcode_macro UNLOAD_FILAMENT]
description: Unload filament exactly 275mm (no extra jogs)
gcode:
  {% set temp = params.TEMP|default(printer.extruder.target)|int %}
  {% if temp|int < 170 %}
    {% set temp = 220 %}
  {% endif %}

  M117 Unloading Filament...
  SAVE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT

  M83
  M109 S{temp}             ; heat and wait (override with TEMP= if desired)
  G1 E-275 F1800           ; exactly 275mm retract to remove
  M400

  RESTORE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT
  M117 Remove Filament Now!
  M300 S300 P1000

