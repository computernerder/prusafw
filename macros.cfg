[gcode_macro LOAD_MESH_TEMP]

gcode:
    {% set default_parameter_BED_TEMPERATURE = 0 %}
    {% set default_parameter_FORCE = 0 %}
    {action_respond_info("- AUTOMATED BED MESH GENERATOR -")}
    {% if BED_TEMPERATURE|int < 30 %}
        {action_respond_info("Your bed temp is to low, make sure it is at least 30 or higher")}
    {% else %}
        {% if printer.configfile.config["bed_mesh " + BED_TEMPERATURE] is defined and FORCE|int == 0 %}
            BED_MESH_PROFILE LOAD={BED_TEMPERATURE}
            {action_respond_info("Succesfully loaded bed_mesh "+ BED_TEMPERATURE)}
        {% else %}
            {% if printer.configfile.config["bed_mesh " + BED_TEMPERATURE] is defined and FORCE|int == 1 %}
                BED_MESH_PROFILE REMOVE={BED_TEMPERATURE}
            {% endif %}
            {action_respond_info("bed_mesh not defined, your bed temperature will go up!")}
            {action_respond_info("We will probe the bed and save the mesh as bed_mesh "+ BED_TEMPERATURE)}
            ADD_BED_MESH TARGET_TEMP={BED_TEMPERATURE}
        {% endif %}
    {% endif %}

[gcode_macro ADD_BED_MESH]

gcode:
    {% set default_parameter_TARGET_TEMP = 30 %}
    M190 S{TARGET_TEMP} # Wait for the bed to hit TARGET_TEMP
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE={TARGET_TEMP}

[gcode_macro SET_RETRACTIONLENGTH]
gcode:
  SET_RETRACTION RETRACT_LENGTH={params.LENGTH|float}
  GET_RETRACTION

[gcode_macro G29]
gcode:
 
 BED_MESH_CALIBRATE
 BED_MESH_PROFILE SAVE=p1
 BED_MESH_PROFILE LOAD=p1
 G1 Z30 F4000

[gcode_macro FILAMENT_CHANGE]
description: Filament change helper (parks, optional unload, optional standby temp; RESUME reheats + primes)
variable_active: 0
variable_restore_temp: 0
variable_prime: 8.0
gcode:
  {% set x = params.X|default(90)|float %}
  {% set y = params.Y|default(0)|float %}
  {% set z_hop = params.Z|default(10)|float %}
  {% set unload = params.UNLOAD|default(0)|float %}
  {% set standby = params.STANDBY|default(0)|int %}
  {% set prime = params.PRIME|default(8.0)|float %}

  # Store current target temp so RESUME can reheat.
  SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=restore_temp VALUE={printer.extruder.target|int}
  SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=prime VALUE={prime}

  SAVE_GCODE_STATE NAME=FILAMENT_CHANGE_state
  PAUSE_BASE

  # Optional standby temperature while waiting (0 disables).
  {% if standby|int > 0 %}
    M104 S{standby|int}
  {% endif %}

  G91
  G1 E-0.8 F2700
  G1 Z{z_hop} F900
  G90
  G1 X{x} Y{y} F6000

  # Optional unload pullback (keeps absolute/relative extrusion safe).
  {% if unload|float > 0 %}
    G91
    G1 E-{unload|float} F1000
  {% endif %}
  RESTORE_GCODE_STATE NAME=FILAMENT_CHANGE_state
  {action_respond_info("Filament change: swap filament, then press RESUME (use UNLOAD=50 if you want a full unload pullback)")}


[gcode_macro M600]
description: Alias for FILAMENT_CHANGE
gcode:
  {% if printer['gcode_macro _M600_GUARD'].active|int == 1 and (rawparams|default('')|string|trim) == '' %}
    {action_respond_info("Ignoring startup M600 inserted by slicer")}
    SET_GCODE_VARIABLE MACRO=_M600_GUARD VARIABLE=active VALUE=0
  {% else %}
    FILAMENT_CHANGE {rawparams}
  {% endif %}


