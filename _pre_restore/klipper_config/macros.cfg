[gcode_macro PRINT_START]

gcode:
       # Load variables
    {% set bed_temp = params.BED|default(60)|int %}
    {% set extruder_temp = params.EXTRUDER|default(200)|int %}
    {% set nozzle_size = params.NOZZLE|default(0.4)|float %}
    M83
    M104 S{extruder_temp}                   ; set extruder holding temp, dont wait
    M190 S{bed_temp}                        ; set bed temp and wait for it reach temp
    G28                                     ; home all axes
    G29                                     ; ABL
    M104 S{extruder_temp}                   ; Set extruder temp dont wait    
    G1 Y-2.0 X179 F2400                     ; Move to start position x, y
    G1 Z3 F720                              ; move to start postiion z
    M109 S{extruder_temp}                   ; Set extruder temp wait
    

    G92 E0.0                                ;Set extruded to 0
    G1 E50 F2100                            ;extrude
    PURGE EXTRUDER={extruder_temp}
    M221 S100 ; set flow


[gcode_macro PURGE]

gcode:
    {% set extruder_temp = params.EXTRUDER|default(200)|int %}
    
    M109 S{extruder_temp}
    G90
    G1 X170 F1000
    G1 Z0.2 F720
    G1 X110.0 E8.0 F900
    G1 X40.0 E10.0 F700
    G92 E0.0
   
    G1 Z20


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5 F2100 ; retract
    

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F50000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F50000  ; park nozzle at rear
    G1 E-45 F2100 ; retract
    M221 S100 ; reset flow
    TURN_OFF_HEATERS
    M107                                     ; turn off fan 
    M84 ; disable motors

    
    
    ;BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    



[gcode_macro Load_Filament_1]
gcode:
  {% set Temp = params.Temp|default(255)|float %}
  M104 S{Temp}  ;Set temp 
  G91
  G1 E180 F2100;  Load
  G1 E50 F1000 ; prime

[gcode_macro TEMPERATURE_TOWER]
gcode:
  {% set START = params.START|default(220)|float %}
  {% set INC = params.INC|default(-5)|float %}
  {% set MM = params.MM|default(10)|float %}
  {% set SKIP = params.Skip|default(1.4)|float %}
  {% set START = START - INC / 2 %}
  {% set FACTOR = INC / MM %}
  TUNING_TOWER COMMAND='SET_HEATER_TEMPERATURE HEATER=extruder' PARAMETER=TARGET START={START} FACTOR={FACTOR} BAND={MM} SKIP={SKIP}



[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}



# Filament change gcode, parameters are a default park position if no XYZ is specified  - Z is relative.
[gcode_macro M600_1]

gcode:
    {% set X = params.X|default(100)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    M117 Ready for unload

