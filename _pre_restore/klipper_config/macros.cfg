[gcode_macro UNLOAD_FILAMENT]
gcode:
    M117 Unloading Filament...
    G1 E0.5 F1000
    G1 E-0.5 F1000
    G1 E1.0 F1000
    G1 E-1.0 F1000
    G1 E1.5 F1000
    G1 E-1.5 F1000
    G1 E2.0 F1000
    G1 E-100 F3000
    M400
    M117 Remove Filament Now!
    M300 S300 P1000

